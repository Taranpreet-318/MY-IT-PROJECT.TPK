<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - OES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-bg"><style>/* General styling */
body {
  font-family: 'Poppins', sans-serif;
  color: #333;
}

/* Home Page */
.home-bg {
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  height: 100vh;
}

.title {
  font-size: 3rem;
  font-weight: 700;
}

.subtitle {
  font-size: 1.2rem;
  opacity: 0.9;
}

.btn-custom {
  background-color: #ffcb05;
  color: #222;
  font-weight: 600;
  border-radius: 30px;
  transition: all 0.3s;
}

.btn-custom:hover {
  background-color: #ffd84d;
  transform: scale(1.05);
}

/* Login Page */
.login-bg {
  background: linear-gradient(135deg, #2b5876, #4e4376);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-container {
  background: #04093ce3;
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
  width: 350px;
  text-align: center;
}

.login-container h2 {
  margin-bottom: 20px;
  font-weight: 600;
  color: #f2f3f4;
}

.back-link {
  display: block;
  margin-top: 15px;
  color: #444;
  text-decoration: none;
}

.back-link:hover {
  text-decoration: underline;
}

/* Dashboard Cards */
.dashboard-card {
  background: #f5f6fce3;
  border: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  border-radius: 15px;
  padding: 20px;
  text-align: center;
  transition: transform 0.3s;
}

.dashboard-card:hover {
  transform: translateY(-5px);
}
 img {
      position: absolute;
      left: 20px;
      top: 0px;
      z-index: -1;
      width: 100%;
      height: 100%;
    }
</style>
  <div class="login-container">
    <h2>Student Login</h2>
  <form id="studentLoginForm" action="#">
      <input type="text" placeholder="Student ID" class="form-control mb-3" required>
      <input type="password" placeholder="Password" class="form-control mb-3" required>
      <button class="btn btn-custom w-100">Login</button>
    </form>
    <a href="index.html" class="back-link">Back to Home</a>
  </div>
<script>
    document.getElementById('studentLoginForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent form refresh
      alert("Login Successful!");
      window.location.href = "student-quiz.html"; // Redirect to quiz page
    });
  </script>

   <img src="https://static.vecteezy.com/system/resources/previews/025/547/454/large_2x/study-doodle-background-vector.jpg">
</body>
</html>
