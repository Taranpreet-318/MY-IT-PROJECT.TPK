<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div class="container mt-5">
    <h2 class="text-center mb-4">Student Quiz</h2>

    <!-- Timer -->
    <h4 class="text-end text-danger" id="timer">Time Left: 60s</h4>

    <!-- Quiz Card -->
    <div id="quiz-box" class="p-4 shadow-lg rounded bg-light" style="display:none;">

      <h5 id="question-text"></h5>

      <div class="mt-3">
        <div>
          <input type="radio" name="option" value="A" id="optA">
          <label for="optA" id="labelA"></label>
        </div>

        <div>
          <input type="radio" name="option" value="B" id="optB">
          <label for="optB" id="labelB"></label>
        </div>

        <div>
          <input type="radio" name="option" value="C" id="optC">
          <label for="optC" id="labelC"></label>
        </div>

        <div>
          <input type="radio" name="option" value="D" id="optD">
          <label for="optD" id="labelD"></label>
        </div>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-secondary" id="prevBtn">Previous</button>
        <button class="btn btn-secondary" id="nextBtn">Next</button>
        <button class="btn btn-success" id="submitBtn">Submit</button>
      </div>

    </div>

    <!-- Result -->
    <div id="result-box" class="text-center mt-5" style="display:none;">
      <h3>Your Score:</h3>
      <h1 id="score" class="text-primary"></h1>
    </div>

  </div>

  <script>
    let questions = [];
    let currentIndex = 0;
    let answers = {};
    let timerValue = 60;
    let timer;

    // Fetch questions from backend
    fetch("https://exam-portal-backend-4vou.onrender.com/")
      .then(res => res.json())
      .then(data => {
        questions = data;
        document.getElementById("quiz-box").style.display = "block";
        loadQuestion();
        startTimer();
      });

    // Load a question
    function loadQuestion() {
      const q = questions[currentIndex];

      document.getElementById("question-text").innerText =
        (currentIndex + 1) + ". " + q.question;

      document.getElementById("labelA").innerText = q.options.A;
      document.getElementById("labelB").innerText = q.options.B;
      document.getElementById("labelC").innerText = q.options.C;
      document.getElementById("labelD").innerText = q.options.D;

      // Restore selected answer
      document.querySelectorAll("input[name='option']").forEach(opt => {
        opt.checked = answers[currentIndex] === opt.value;
      });
    }

    // Save answer
    function saveAnswer() {
      const selected = document.querySelector("input[name='option']:checked");
      if (selected) answers[currentIndex] = selected.value;
    }

    // Buttons
    document.getElementById("nextBtn").onclick = () => {
      saveAnswer();
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        loadQuestion();
      }
    };

    document.getElementById("prevBtn").onclick = () => {
      saveAnswer();
      if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
      }
    };

    document.getElementById("submitBtn").onclick = submitQuiz;

    // Timer
    function startTimer() {
      timer = setInterval(() => {
        timerValue--;
        document.getElementById("timer").innerText = "Time Left: " + timerValue + "s";

        if (timerValue <= 0) {
          clearInterval(timer);
          submitQuiz();
        }
      }, 1000);
    }

    // Submit Quiz
    function submitQuiz() {
      saveAnswer();
      clearInterval(timer);

      let score = 0;

      questions.forEach((q, i) => {
        if (answers[i] === q.answer) {
          score++;
        }
      });

      // Show score
      document.getElementById("quiz-box").style.display = "none";
      document.getElementById("result-box").style.display = "block";
      document.getElementById("score").innerText = score + " / " + questions.length;
    }
  </script>

</body>
</html>
