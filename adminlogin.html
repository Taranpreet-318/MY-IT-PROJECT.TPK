<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - OES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* ===== General Styling ===== */
    body {
      font-family: 'Poppins', sans-serif;
      color: #333;
    }

    /* ===== Background ===== */
    .login-bg {
      background: linear-gradient(135deg, #2b5876, #4e4376);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===== Container ===== */
    .login-container {
      background: #04093ce3;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      width: 380px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== Title ===== */
    .login-container h2 {
      margin-bottom: 25px;
      font-weight: 700;
      color: #fdf5f5;
    }

    /* ===== Input Fields ===== */
    .form-control {
      border-radius: 0.5rem;
      padding: 10px;
      border: 1px solid #ced4da;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: #6f42c1;
      box-shadow: 0 0 5px rgba(111, 66, 193, 0.4);
    }

    /* ===== Button ===== */
    .btn-custom {
      background-color: #ffcb05;
      color: #222;
      font-weight: 600;
      border-radius: 30px;
      transition: all 0.3s;
    }

    .btn-custom:hover {
      background-color: #ffd84d;
      transform: scale(1.05);
    }

    /* ===== Back Link ===== */
    .back-link {
      display: block;
      margin-top: 15px;
      color: #444;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* ===== Captcha ===== */
    .captcha-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .captcha {
      background: #f4f4f4;
      border: 1px dashed #777;
      border-radius: 8px;
      padding: 10px 15px;
      font-weight: bold;
      font-family: monospace;
      font-size: 1.1rem;
      user-select: none;
    }

    .refresh-btn {
      background: #6f42c1;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .refresh-btn:hover {
      background: #8756d6;
    }

    @media (max-width: 400px) {
      .login-container {
        width: 90%;
      }
    }

     
     img{
      position:absolute;
      left:20px;
      top:0px;
      z-index:-1;
      width:100%;
      height:100%;
    }
  </style>
</head>

<body class="login-bg">
  <div class="login-container">
    <h2>Admin Login</h2>
    <form onsubmit="return validateCaptcha()">
      <input type="text" id="adminID" placeholder="Admin ID" class="form-control mb-3" required>
      <input type="email" id="email" placeholder="Email Address" class="form-control mb-3" required>
      <input type="password" id="password" placeholder="Password" class="form-control mb-3" required>

      <div class="captcha-box">
        <div id="captcha" class="captcha"></div>
        <button type="button" class="refresh-btn" onclick="generateCaptcha()">↻</button>
      </div>
      <input type="text" id="captchaInput" class="form-control mb-3" placeholder="Enter Captcha" required>

      <button type="submit" class="btn btn-custom w-100 mb-2">Login</button>
      

    </form>

    <!-- Link back to Index Page -->
    <a href="index.html" class="back-link"></a>
  </div>

  <script>
    // ===== Captcha Generator =====
    function generateCaptcha() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let captcha = "";
      for (let i = 0; i < 6; i++) {
        captcha += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById("captcha").textContent = captcha;
    }

    function validateCaptcha() {
      const captcha = document.getElementById("captcha").textContent.trim();
      const input = document.getElementById("captchaInput").value.trim();
      if (input !== captcha) {
        alert("Incorrect Captcha. Please try again!");
        generateCaptcha();
        return false;
      }
      alert("Login Successful ");
      window.location.href = "admin-dashboard.html"; // redirect after success
      return false;
    }

    // Generate captcha on load
    window.onload = generateCaptcha;
   
document.getElementById('quizForm').addEventListener('submit', function(e) {
  e.preventDefault();

  // Get values
  const question = document.getElementById('question').value;
  const options = Array.from(document.querySelectorAll('#quizForm input[type="text"]'))
                       .slice(1) // skip the first input (question)
                       .map(input => input.value);
  const correct = document.querySelector('#quizForm select').value;

  // Retrieve existing quizzes
  let quizzes = JSON.parse(localStorage.getItem('quizzes')) || [];

  // Add new question
  quizzes.push({ question, options, correct });

  // Save to localStorage
  localStorage.setItem('quizzes', JSON.stringify(quizzes));

  alert("✅ Question added successfully!");
  this.reset();
});


  </script>
    <img src="https://static.vecteezy.com/system/resources/previews/025/547/454/large_2x/study-doodle-background-vector.jpg">
</body>
</html>
