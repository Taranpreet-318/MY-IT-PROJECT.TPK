<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - IKGPTU Exam Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f6f9;
      font-family: 'Poppins', sans-serif;
    }

    .navbar {
      background: linear-gradient(90deg, #1e3c72, #2a5298);
    }
    .navbar-brand {
      color: white !important;
      font-weight: 600;
    }

    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
    }

    .form-section {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn-primary {
      background: #2a5298;
      border: none;
    }
    .btn-primary:hover {
      background: #1e3c72;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">IKGPTU Exam Portal - Admin Panel</a>
      <a href="index.html" class="btn btn-light btn-sm ms-auto">Logout</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h3 class="mb-4 text-center">Admin Dashboard</h3>

    <

    <!-- Add Quiz Question -->
    <div class="form-section mb-5">
      <h4 class="mb-3">Add Quiz Question</h4>

      <form id="quizForm">
        <div class="mb-3">
          <label for="question" class="form-label">Question</label>
          <input type="text" id="question" class="form-control" placeholder="Enter question" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Options</label>
          <input type="text" id="optA" class="form-control mb-2" placeholder="Option A" required>
          <input type="text" id="optB" class="form-control mb-2" placeholder="Option B" required>
          <input type="text" id="optC" class="form-control mb-2" placeholder="Option C" required>
          <input type="text" id="optD" class="form-control mb-2" placeholder="Option D" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Correct Answer</label>
          <select id="correctAnswer" class="form-select" required>
            <option value="">Select correct option</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>

        <button class="btn btn-primary w-100">Add Question</button>
      </form>
    </div>

<script>
document.getElementById("quizForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const questionData = {
        question: document.getElementById("question").value,
        options: {
            A: document.getElementById("optA").value,
            B: document.getElementById("optB").value,
            C: document.getElementById("optC").value,
            D: document.getElementById("optD").value
        },
        answer: document.getElementById("correctAnswer").value
    };

    fetch("https://exam-portal-backend-4vou.onrender.com/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(questionData)
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        document.getElementById("quizForm").reset();
    });
});
</script>

    <!-- Student Attempts -->
    <div class="form-section">
      <h4 class="mb-3">Student Attempts</h4>

        <thead>

            <th>Student Name</th>

    </div>
  </div>

  <footer>© 2025 IKGPTU Online Examination System | Admin Panel</footer>

</body>
</html>
